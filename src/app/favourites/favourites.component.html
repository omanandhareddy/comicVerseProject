<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet" />

<nav class="fav-navbar">
  <div class="btn-con">
    <button class="back-btn" (click)="back()">←</button>
  </div>
  <div class="nav-con">
    <h1 class="nav-title">FAVOURITES ({{ favourites.length }})</h1>
  </div>
</nav>
<div *ngIf="isLoading">
  <div class="skeleton-grid">
    <div class="skeleton-card" *ngFor="let item of [1,2,3,4,5]">
      <div class="skeleton-img"></div>
      <div class="skeleton-text short"></div>
      <div class="skeleton-text long"></div>
    </div>
  </div>
</div>

<!-- EXISTING FAVOURITES CONTENT -->
<div class="favourites-container" *ngIf="favourites.length > 0">
  <div *ngFor="let comic of favourites" class="card-verse">
    <div class="card-content">
      <div class="remove-btn" (click)="removeFromFavourites(comic.title)">✕</div>
      <div class="card-label-top">{{ comic.title }}</div>
      <div class="card-cover" [style.backgroundImage]="'url(' + comic.cover + ')'" (click)="toO(comic)"></div>
    </div>
  </div>
</div>

<app-footer></app-footer>
